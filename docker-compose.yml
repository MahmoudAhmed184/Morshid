name: morshid

services:
  postgres:
    image: pgvector/pgvector:0.8.4-pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-morshid}
      POSTGRES_USER: ${POSTGRES_USER:-morshid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-morshid_local_password}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - morshid-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.4-alpine
    restart: unless-stopped
    command:
      ['redis-server', '--appendonly', 'yes', '--appendfsync', 'everysec']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - morshid-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    profiles: ['app']
    build:
      context: .
      dockerfile: server/Dockerfile
      target: migration
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-morshid}:${POSTGRES_PASSWORD:-morshid_local_password}@postgres:5432/${POSTGRES_DB:-morshid}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  server:
    profiles: ['app']
    build:
      context: .
      dockerfile: server/Dockerfile
      target: server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-morshid}:${POSTGRES_PASSWORD:-morshid_local_password}@postgres:5432/${POSTGRES_DB:-morshid}
      REDIS_URL: redis://redis:6379
      PDF_STORAGE_PATH: /workspace/storage/pdfs
      # Deterministic remains the keyless/offline default. The production
      # environment gate below refuses Gemini even if an ambient variable tries
      # to select it.
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-deterministic}
      EMBEDDING_QUERY_TIMEOUT_MS: ${EMBEDDING_QUERY_TIMEOUT_MS:-10000}
      EMBEDDING_DOCUMENT_TIMEOUT_MS: ${EMBEDDING_DOCUMENT_TIMEOUT_MS:-120000}
      EMBEDDING_REQUEST_TIMEOUT_MS: ${EMBEDDING_REQUEST_TIMEOUT_MS:-30000}
      COMPLETION_PROVIDER: ${COMPLETION_PROVIDER:-deterministic}
      COMPLETION_TIMEOUT_MS: ${COMPLETION_TIMEOUT_MS:-30000}
      # Socratic runtime roles are deliberately independent. Production boot
      # rejects a deterministic Semantic Guard, while deterministic analysis
      # and tutor providers remain available for explicit offline diagnostics.
      ANALYSIS_MODEL_PROVIDER: ${ANALYSIS_MODEL_PROVIDER:-deterministic}
      ANALYSIS_MODEL_BASE_URL: ${ANALYSIS_MODEL_BASE_URL:-http://localhost:8000/v1}
      ANALYSIS_MODEL_NAME: ${ANALYSIS_MODEL_NAME:-Qwen/Qwen2.5-14B-Instruct}
      ANALYSIS_MODEL_API_KEY: ${ANALYSIS_MODEL_API_KEY:-}
      ANALYSIS_MODEL_TIMEOUT_MS: ${ANALYSIS_MODEL_TIMEOUT_MS:-30000}
      ANALYSIS_CONFIDENCE_THRESHOLD: ${ANALYSIS_CONFIDENCE_THRESHOLD:-0.6}
      ANALYSIS_MODEL_MAX_RETRIES: ${ANALYSIS_MODEL_MAX_RETRIES:-1}
      TUTOR_MODEL_PROVIDER: ${TUTOR_MODEL_PROVIDER:-deterministic}
      TUTOR_MODEL_BASE_URL: ${TUTOR_MODEL_BASE_URL:-http://localhost:8000/v1}
      TUTOR_MODEL_NAME: ${TUTOR_MODEL_NAME:-Qwen/Qwen2.5-7B-Instruct}
      TUTOR_MODEL_API_KEY: ${TUTOR_MODEL_API_KEY:-}
      TUTOR_MODEL_TIMEOUT_MS: ${TUTOR_MODEL_TIMEOUT_MS:-30000}
      TUTOR_MODEL_MAX_INFRASTRUCTURE_RETRIES: ${TUTOR_MODEL_MAX_INFRASTRUCTURE_RETRIES:-1}
      SEMANTIC_GUARD_PROVIDER: ${SEMANTIC_GUARD_PROVIDER:-deterministic}
      SEMANTIC_GUARD_BASE_URL: ${SEMANTIC_GUARD_BASE_URL:-http://localhost:8000/v1}
      SEMANTIC_GUARD_MODEL_NAME: ${SEMANTIC_GUARD_MODEL_NAME:-Qwen/Qwen2.5-7B-Instruct-Guard}
      SEMANTIC_GUARD_API_KEY: ${SEMANTIC_GUARD_API_KEY:-}
      SEMANTIC_GUARD_TIMEOUT_MS: ${SEMANTIC_GUARD_TIMEOUT_MS:-30000}
      ITI_BEDROCK_GATEWAY_BASE_URL: ${ITI_BEDROCK_GATEWAY_BASE_URL:-https://apiaccess.iti.net.eg/api/v1}
      ITI_BEDROCK_GATEWAY_API_KEY: ${ITI_BEDROCK_GATEWAY_API_KEY:-}
      # Production never permits the temporary plaintext development transport.
      # The schema also accepts a blank value as false, so the pinned 'false'
      # here is an explicit statement rather than a load-bearing one.
      ITI_BEDROCK_ALLOW_INSECURE_HTTP: 'false'
      AWS_BEDROCK_MODEL_ID: ${AWS_BEDROCK_MODEL_ID:-}
      AWS_BEDROCK_ALLOWED_MODEL_IDS: ${AWS_BEDROCK_ALLOWED_MODEL_IDS:-}
      # Must land in 256-4096 whatever the provider: below that floor the
      # gateway has been observed returning HTTP 200 with blank output while
      # still billing a usage event. The 1024 default is well above it.
      AWS_BEDROCK_MAX_TOKENS: ${AWS_BEDROCK_MAX_TOKENS:-1024}
      # No insecure fallback: an unset variable is passed through empty (not a
      # committed placeholder), and the server's env schema rejects empty,
      # placeholder, or identical secrets at boot. A `:?` guard is intentionally
      # avoided here because Compose interpolates the whole file even for the
      # infrastructure-only `infra:up` command, which must not require app secrets.
      AUTH_ACCESS_TOKEN_SECRET: ${AUTH_ACCESS_TOKEN_SECRET}
      AUTH_REFRESH_TOKEN_HASH_SECRET: ${AUTH_REFRESH_TOKEN_HASH_SECRET}
      AUTH_ACCESS_TOKEN_TTL_SECONDS: ${AUTH_ACCESS_TOKEN_TTL_SECONDS:-900}
      AUTH_REFRESH_TOKEN_TTL_DAYS: ${AUTH_REFRESH_TOKEN_TTL_DAYS:-7}
    ports:
      - '${PORT:-4000}:4000'
    volumes:
      - morshid-pdf-storage:/workspace/storage/pdfs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/health/ready').then((response) => process.exit(response.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  morshid-postgres-data:
  morshid-redis-data:
  morshid-pdf-storage:
